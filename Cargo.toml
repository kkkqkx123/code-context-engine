[workspace]
exclude = ["crates/infra/llm-suite"]
members = [
    # core
    "crates/core/cce-types",
    "crates/core/cce-config",
    "crates/core/cce-logging",
    "crates/core/cce-utils",
    "crates/core/cce-metrics",
    "crates/core/cce-text",
    "crates/core/cce-plugin",
    "crates/core/cce-llm",
    # parser
    "crates/parser/cce-parser",
    "crates/parser/cce-parser-core",
    "crates/parser/cce-document",
    "crates/parser/cce-stdlib",
    "crates/parser/cce-codegraph",
    # infra
    "crates/infra/cce-circuit-breaker",
    "crates/infra/cce-llm-client",
    "crates/infra/cce-storage-common",
    "crates/infra/cce-storage-bm25",
    "crates/infra/cce-storage-vector-qdrant",
    "crates/infra/cce-storage-vector-local",
    "crates/infra/cce-storage-metadb-sqlite",
    "crates/infra/cce-storage-metadb-pg",
    "crates/infra/cce-scanner",
    "crates/infra/cce-ingest-transfer",
    # local vector engine (git submodule: https://github.com/kkkqkx123/simvec)
    "crates/simvec",
    # encoding detection (git remote: https://github.com/kkkqkx123/encoding-guess)
    "crates/encoding-guess",
    # app
    "crates/app/cce-api",
    "crates/app/cce-transport",
    "crates/app/cce-admission",
    "crates/app/cce-plugin-runtime",
    "crates/app/cce-orchestrator",
    "crates/app/cce-server",
    "crates/app/cce-server-shared",
    "crates/app/cce-mcp",
    "crates/app/cce-e2e-tests",
    "crates/app/cce-cli",
    "crates/app/cce-gateway",
    "crates/app/cce-bench-kit",
    "crates/app/cce-plugin-sdk",
    # vendored tree-sitter grammars (git submodules)
    "crates/tree-sitter/tree-sitter-svelte",
    "crates/tree-sitter/tree-sitter-vue",
    "crates/tree-sitter/tree-sitter-c",
    "crates/tree-sitter/tree-sitter-cpp",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
license = "GPL-3.0-only"
repository = "https://github.com/kkkqkx123/code-context-engine"

[workspace.dependencies]
# asynchronous runtime
tokio = { version = "1.50", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "fs",
    "process",
    "tracing",
] }
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
utoipa = "5.5"
toml = "1.1"
rkyv = { version = "0.8", features = ["bytecheck", "alloc", "std"] }
zstd = "0.13"

# Memory optimization
compact_str = { version = "0.8", features = ["serde"] }
smallvec = { version = "1.11", features = ["serde"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Log
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "fmt",
    "json",
    "registry",
] }
tracing-appender = "0.2.4"

# HTTP
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
axum = { version = "0.8.8", features = ["macros", "ws"] }

# Tree-sitter
tree-sitter = "0.26"
tree-sitter-c = { package = "kkkqkx-tree-sitter-c", version = "0.24.2", path = "crates/tree-sitter/tree-sitter-c" }
tree-sitter-cpp = { package = "kkkqkx-tree-sitter-cpp", version = "0.23.4", path = "crates/tree-sitter/tree-sitter-cpp" }
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-php = "0.24"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-scala = "0.23"
tree-sitter-html = "0.23"
tree-sitter-css = "0.25"
tree-sitter-dart = "0.1"
tree-sitter-lua = "0.5"
tree-sitter-bash = "0.25"
tree-sitter-embedded-template = "0.25"
streaming-iterator = "0.1"

# File system
walkdir = "2.5"

# Text Processing
regex = "1.11"
whatlang = "0.16"
unicase = "2.8"
encoding_rs = "0.8"
quick-xml = { version = "0.35", features = ["serialize"] }
yaml-rust2 = "0.11.0"
once_cell = "1.19"

# Hash
sha2 = "0.10"
hex = "0.4.3"

# Rate Limiting
governor = "0.10"

# SQLite
rusqlite = { version = "0.39", features = ["bundled"] }

# PostgreSQL remote branch (relation storage)
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
deadpool-postgres = { version = "0.14", features = ["serde"] }

# Async trait support
async-trait = "0.1"

# Benchmarking framework (used by all T-1..T-10 performance benchmarks)
criterion = "0.5"

# Full-text search
jieba-rs = "0.10"

# Tools
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6.1"
dotenvy = "0.15"
dirs = "6.0"
rayon = "1.11"
fastrand = "2.1"
tempfile = "3.12"
lru = "0.13"
parking_lot = "0.12"
rand = "0.8"

# Caching
moka = { version = "0.12", features = ["future"] }

# File system watching
notify = "8.2"
sysinfo = "0.33"

# Plugin system
mlua = { version = "0.11", features = ["vendored", "lua55", "send"] }
libloading = "0.9"
globset = "0.4"

# System utilities
num_cpus = "1.16"
uuid = { version = "1.0", features = ["v4", "v5"] }

# Vendored internal crates
# NOTE: the tantivy fork (crates/tantivy, upstream 0.27 +
# `feat/add-configurable-k1-b` branch) is published to crates.io as the
# renamed `kkkqkx-tantivy` package (the upstream names are taken); the
# dependency keeps the `tantivy` name and resolves locally through
# `[patch.crates-io]`. The version declared here MUST stay in sync with the
# fork's own Cargo.toml version, otherwise the patch disengages and local
# submodule changes are silently ignored.
tantivy = { package = "kkkqkx-tantivy", version = "0.27" }
tree-sitter-svelte = { package = "kkkqkx-tree-sitter-svelte", version = "1.0.2", path = "crates/tree-sitter/tree-sitter-svelte" }
tree-sitter-vue = { package = "kkkqkx-tree-sitter-vue", version = "0.26.0", path = "crates/tree-sitter/tree-sitter-vue" }
cce-circuit-breaker = { path = "crates/infra/cce-circuit-breaker" }
cce-storage-common = { path = "crates/infra/cce-storage-common" }
cce-storage-bm25 = { path = "crates/infra/cce-storage-bm25" }
cce-storage-vector-qdrant = { path = "crates/infra/cce-storage-vector-qdrant" }
cce-storage-vector-local = { path = "crates/infra/cce-storage-vector-local" }
cce-storage-metadb-sqlite = { path = "crates/infra/cce-storage-metadb-sqlite" }
simvec = { path = "crates/simvec" }

# MCP SDK (official modelcontextprotocol/rust-sdk).
rmcp = "3.4"

# Internal app-layer crates
cce-server-shared = { path = "crates/app/cce-server-shared" }
cce-mcp = { path = "crates/app/cce-mcp" }

[patch.crates-io]
# Vendored tantivy fork: patch the renamed root package so local development
# always builds from the submodule. The fork's sub-crates are renamed to
# `kkkqkx-tantivy-*` too and resolve through the submodule's own workspace
# path dependencies, so no further patch entries are needed.
kkkqkx-tantivy = { path = "crates/tantivy" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true
codegen-units = 64
