[package]
name = "cce-text"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Text processing utilities for the code context engine"

[dependencies]
cce-utils = { path = "../cce-utils" }
regex = { workspace = true }
jieba-rs = { workspace = true }
serde = { workspace = true }
tantivy = { workspace = true, optional = true }

[features]
default = ["tantivy"]
tantivy = ["dep:tantivy"]

[[bench]]
name = "mixed_tokenizer"
harness = false
