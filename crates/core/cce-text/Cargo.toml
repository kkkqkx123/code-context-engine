[package]
name = "cce-text"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Text processing utilities for the code context engine"
license.workspace = true
repository.workspace = true

[dependencies]
cce-utils = { version = "0.1.0", path = "../cce-utils" }
regex = { workspace = true }
jieba-rs = { workspace = true }
serde = { workspace = true }
tantivy = { workspace = true, optional = true }

[features]
default = ["tantivy"]
tantivy = ["dep:tantivy"]

[dev-dependencies]
cce-bench-kit = { version = "0.1.0", path = "../../bench/cce-bench-kit" }

[[bench]]
name = "mixed_tokenizer"
harness = false
