[package]
name = "cce-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Lightweight file supply gateway for remote hosting: enumerate, fingerprint, push, observe"
license.workspace = true
repository.workspace = true

[[bin]]
name = "cce-gateway"
path = "src/main.rs"

[lib]
name = "cce_gateway"
path = "src/lib.rs"

[dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
clap = { version = "4.6", features = ["derive", "env"] }
base64 = "0.22"
cce-api = { version = "0.1.0", path = "../cce-api" }
cce-scanner = { version = "0.1.0", path = "../../infra/cce-scanner" }
cce-supply = { version = "0.1.0", path = "../../infra/cce-supply" }
cce-types = { version = "0.1.0", path = "../../core/cce-types" }
cce-config = { version = "0.1.0", path = "../../core/cce-config" }
cce-logging = { version = "0.1.0", path = "../../core/cce-logging" }
cce-utils = { version = "0.1.0", path = "../../core/cce-utils" }
zstd = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
