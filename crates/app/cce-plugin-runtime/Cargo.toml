[package]
name = "cce-plugin-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Lua and native plugin execution runtime for the code context engine"
license.workspace = true
repository.workspace = true

[dependencies]
cce-types = { version = "0.1.0", path = "../../core/cce-types" }
cce-utils = { version = "0.1.0", path = "../../core/cce-utils" }
cce-metrics = { version = "0.1.0", path = "../../core/cce-metrics" }
cce-plugin = { version = "0.1.0", path = "../../core/cce-plugin" }
compact_str = { workspace = true }
smallvec = { workspace = true }
mlua = { workspace = true, features = ["vendored", "lua55", "send"] }
libloading = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
