[package]
name = "cce-export"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Pure NL document rendering over parsed code (exporters, formatters, presentation)"
license.workspace = true
repository.workspace = true

[dependencies]
cce-types = { version = "0.1.0", path = "../../core/cce-types" }
cce-config = { version = "0.1.0", path = "../../core/cce-config" }
cce-utils = { version = "0.1.0", path = "../../core/cce-utils" }
cce-parser = { version = "0.1.0", path = "../../parser/cce-parser" }
cce-codegraph = { version = "0.1.0", path = "../../parser/cce-codegraph" }
cce-plugin = { version = "0.1.0", path = "../../core/cce-plugin" }
cce-text = { version = "0.1.0", path = "../../core/cce-text" }
cce-tools = { version = "0.1.0", path = "../cce-tools" }

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
regex = { workspace = true }
smallvec = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
