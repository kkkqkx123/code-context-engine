[package]
name = "cce-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "CLI client for Code Context Engine"
license.workspace = true
repository.workspace = true

[[bin]]
name = "cce-cli"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
dirs = { workspace = true }
toml = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
cce-api = { version = "0.1.0", path = "../cce-api" }
cce-transport = { version = "0.1.0", path = "../cce-transport" }
cce-server-shared = { version = "0.1.0", path = "../cce-server-shared" }
cce-config = { version = "0.1.0", path = "../../core/cce-config" }
cce-logging = { version = "0.1.0", path = "../../core/cce-logging" }
cce-mcp = { version = "0.1.0", path = "../cce-mcp" }
cce-scanner = { version = "0.1.0", path = "../../infra/cce-scanner" }
cce-types = { version = "0.1.0", path = "../../core/cce-types" }
cce-utils = { version = "0.1.0", path = "../../core/cce-utils" }
cce-gateway = { version = "0.1.0", path = "../cce-gateway" }
base64 = "0.22"
tokio-util = "0.7"

clap = { version = "4.6", features = ["derive", "env", "color", "suggestions"] }
colored = "3.1"
comfy-table = "8.0"
urlencoding = "2.1"
