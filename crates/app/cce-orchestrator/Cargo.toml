[package]
name = "cce-orchestrator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Indexing and query orchestration across the parser, storage, and LLM layers"
license.workspace = true
repository.workspace = true

[dependencies]
cce-types = { version = "0.1.0", path = "../../core/cce-types" }
cce-config = { version = "0.1.0", path = "../../core/cce-config" }
cce-utils = { version = "0.1.0", path = "../../core/cce-utils" }
cce-metrics = { version = "0.1.0", path = "../../core/cce-metrics" }
cce-text = { version = "0.1.0", path = "../../core/cce-text" }
cce-plugin = { version = "0.1.0", path = "../../core/cce-plugin" }
cce-llm = { version = "0.1.0", path = "../../core/cce-llm" }
cce-parser = { version = "0.1.0", path = "../../parser/cce-parser" }
cce-codegraph = { version = "0.1.0", path = "../../parser/cce-codegraph" }
cce-storage-bm25 = { version = "0.1.0", path = "../../infra/cce-storage-bm25" }
cce-storage-vector-qdrant = { version = "0.1.0", path = "../../infra/cce-storage-vector-qdrant" }
cce-storage-vector-local = { version = "0.1.0", path = "../../infra/cce-storage-vector-local" }
cce-storage-metadb-sqlite = { version = "0.1.0", path = "../../infra/cce-storage-metadb-sqlite" }
cce-storage-common = { version = "0.1.0", path = "../../infra/cce-storage-common" }
cce-storage-metadb-pg = { version = "0.1.0", path = "../../infra/cce-storage-metadb-pg" }
cce-scanner = { version = "0.1.0", path = "../../infra/cce-scanner" }
cce-supply = { version = "0.1.0", path = "../../infra/cce-supply" }
cce-llm-client = { version = "0.1.0", path = "../../infra/cce-llm-client" }
cce-circuit-breaker = { version = "0.1.0", path = "../../infra/cce-circuit-breaker" }

serde = { workspace = true }
serde_json = { workspace = true }
zstd = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
rkyv = { workspace = true, features = ["bytecheck", "alloc", "std"] }
compact_str = { workspace = true, features = ["serde"] }
smallvec = { workspace = true, features = ["serde"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
futures = { workspace = true }
dashmap = { workspace = true }
parking_lot = { workspace = true }
lru = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
regex = { workspace = true }
rayon = { workspace = true }
walkdir = { workspace = true }
notify = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
async-trait = { workspace = true }
chrono = { workspace = true }
globset = { workspace = true }
moka = { workspace = true }
tantivy = { workspace = true }
tree-sitter = { workspace = true }
rusqlite = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
criterion = { workspace = true }
cce-bench-kit = { version = "0.1.0", path = "../cce-bench-kit" }
tracing-subscriber = { workspace = true }
llm-suite-embedding = { version = "0.1.0", path = "../../infra/llm-suite/crates/llm-suite-embedding", features = ["mock"] }

[[bench]]
name = "chunker_concurrency"
harness = false

[[bench]]
name = "index_pipeline_stages"
harness = false

[[bench]]
name = "hot_update_scaling"
harness = false

[[bench]]
name = "checkpoint_codec"
harness = false

[[bench]]
name = "batch_concurrency"
harness = false

[[bench]]
name = "recovery_curve"
harness = false

[[bench]]
name = "fusion_cache"
harness = false

[[bench]]
name = "layered_chain"
harness = false

[[bench]]
name = "hot_update_scope"
harness = false
