[package]
name = "cce-mcp"
version.workspace = true
edition.workspace = true
# rmcp requires rust 1.88; the rest of the workspace stays on 1.86.
rust-version = "1.88"
description = "MCP (Model Context Protocol) server for the Code Context Engine"
license.workspace = true
repository.workspace = true

[[bin]]
name = "cce-mcp"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "signal"] }
tokio-util = "0.7"
axum = { workspace = true }
schemars = "1.0"
cce-config = { version = "0.1.0", path = "../../core/cce-config" }
cce-types = { version = "0.1.0", path = "../../core/cce-types" }
cce-server-shared = { version = "0.1.0", path = "../cce-server-shared" }
cce-api = { version = "0.1.0", path = "../cce-api" }
cce-orchestrator = { version = "0.1.0", path = "../cce-orchestrator" }
cce-parser = { version = "0.1.0", path = "../../parser/cce-parser" }
cce-codegraph = { version = "0.1.0", path = "../../parser/cce-codegraph" }
cce-storage-metadb-sqlite = { version = "0.1.0", path = "../../infra/cce-storage-metadb-sqlite" }
cce-storage-bm25 = { version = "0.1.0", path = "../../infra/cce-storage-bm25" }

rmcp = { workspace = true, features = [
    "server",
    "macros",
    "transport-io",
    "transport-streamable-http-server",
    "schemars",
] }
