[package]
name = "cce-storage-bm25"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "BM25 full-text storage backends (local Tantivy and remote Elasticsearch)"
license.workspace = true
repository.workspace = true

[features]
default = ["local", "remote"]
local = ["dep:tantivy", "cce-text/tantivy"]
remote = ["dep:reqwest", "dep:cce-circuit-breaker"]

[dependencies]
cce-types = { version = "0.1.0", path = "../../core/cce-types" }
cce-config = { version = "0.1.0", path = "../../core/cce-config" }
cce-storage-common = { version = "0.1.0", path = "../cce-storage-common" }
cce-text = { version = "0.1.0", path = "../../core/cce-text", default-features = false }
cce-utils = { version = "0.1.0", path = "../../core/cce-utils" }
cce-circuit-breaker = { version = "0.1.0", path = "../cce-circuit-breaker", optional = true }
tantivy = { workspace = true, optional = true }
tokio = { workspace = true }
reqwest = { workspace = true, optional = true }
rayon = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
aho-corasick = "1.1"

[dev-dependencies]
tempfile = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "bm25_query"
harness = false
required-features = ["local"]

[[bench]]
name = "bm25_scale"
harness = false
required-features = ["local"]

[[bench]]
name = "bm25_cache"
harness = false
required-features = ["local"]

[[bench]]
name = "bm25_write"
harness = false
required-features = ["local"]
