[package]
name = "cce-storage-bm25"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = ["local", "remote"]
local = ["dep:tantivy", "cce-text/tantivy"]
remote = ["dep:reqwest", "dep:cce-circuit-breaker"]

[dependencies]
cce-types = { path = "../../core/cce-types" }
cce-config = { path = "../../core/cce-config" }
cce-text = { path = "../../core/cce-text", default-features = false }
cce-utils = { path = "../../core/cce-utils" }
cce-circuit-breaker = { path = "../cce-circuit-breaker", optional = true }
tantivy = { workspace = true, optional = true }
tokio = { workspace = true }
reqwest = { workspace = true, optional = true }
rayon = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
aho-corasick = "1.1"

[dev-dependencies]
tempfile = { workspace = true }

[[bench]]
name = "bm25_query"
harness = false
required-features = ["local"]

[[bench]]
name = "bm25_scale"
harness = false
required-features = ["local"]
