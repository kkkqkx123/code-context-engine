[package]
name = "cce-storage-metadb-sqlite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Embedded SQLite metadata and relation storage backend"
license.workspace = true
repository.workspace = true

[dependencies]
cce-types = { version = "0.1.0", path = "../../core/cce-types" }
cce-config = { version = "0.1.0", path = "../../core/cce-config" }
cce-metrics = { version = "0.1.0", path = "../../core/cce-metrics" }
cce-storage-common = { version = "0.1.0", path = "../cce-storage-common" }
cce-circuit-breaker = { version = "0.1.0", path = "../cce-circuit-breaker" }
rusqlite = { workspace = true, features = ["bundled"] }
rkyv = { workspace = true, features = ["bytecheck", "alloc", "std"] }
zstd = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
parking_lot = { workspace = true }
uuid = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "metadata_read"
harness = false

[[bench]]
name = "storage_txn"
harness = false

[[bench]]
name = "metadb_write_amplification"
harness = false
