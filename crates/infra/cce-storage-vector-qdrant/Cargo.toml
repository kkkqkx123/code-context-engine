[package]
name = "cce-storage-vector-qdrant"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Remote vector storage backend powered by Qdrant"
license.workspace = true
repository.workspace = true

[dependencies]
cce-types = { version = "0.1.0", path = "../../core/cce-types" }
cce-config = { version = "0.1.0", path = "../../core/cce-config" }
cce-utils = { version = "0.1.0", path = "../../core/cce-utils" }
cce-storage-common = { version = "0.1.0", path = "../cce-storage-common" }
cce-circuit-breaker = { version = "0.1.0", path = "../cce-circuit-breaker" }
cce-metrics = { version = "0.1.0", path = "../../core/cce-metrics" }
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
