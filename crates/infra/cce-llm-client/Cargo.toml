[package]
name = "cce-llm-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "LLM service client with batching, retries, and resilience"
license.workspace = true
repository.workspace = true

[dependencies]
cce-types = { version = "0.1.0", path = "../../core/cce-types" }
cce-config = { version = "0.1.0", path = "../../core/cce-config" }
cce-llm = { version = "0.1.0", path = "../../core/cce-llm" }
cce-metrics = { version = "0.1.0", path = "../../core/cce-metrics" }
cce-utils = { version = "0.1.0", path = "../../core/cce-utils" }
llm-codec = { version = "0.1.0", path = "../llm-suite/crates/llm-codec" }
llm-client = { version = "0.1.0", path = "../llm-suite/crates/llm-client" }
llm-common = { version = "0.1.0", path = "../llm-suite/crates/llm-common" }
llm-embedding = { version = "0.1.0", path = "../llm-suite/crates/llm-embedding" }
llm-gateway = { version = "0.1.0", path = "../llm-suite/crates/llm-gateway" }
llm-rerank = { version = "0.1.0", path = "../llm-suite/crates/llm-rerank" }
llm-types = { version = "0.1.0", path = "../llm-suite/crates/llm-types" }
tokio = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
futures = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
criterion = { workspace = true }
futures = { workspace = true }
llm-embedding = { version = "0.1.0", path = "../llm-suite/crates/llm-embedding", features = ["mock"] }
llm-rerank = { version = "0.1.0", path = "../llm-suite/crates/llm-rerank", features = ["mock"] }

[[bench]]
name = "embedding_scheduling"
harness = false
