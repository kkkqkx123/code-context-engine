[package]
name = "cce-scanner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
cce-types = { path = "../../core/cce-types" }
cce-config = { path = "../../core/cce-config" }
cce-utils = { path = "../../core/cce-utils" }
cce-metrics = { path = "../../core/cce-metrics" }
cce-plugin = { path = "../../core/cce-plugin" }
cce-plugin-runtime = { path = "../../app/cce-plugin-runtime" }

serde = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs"] }
rayon = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
criterion = { workspace = true }
rayon = { workspace = true }
num_cpus = { workspace = true }
cce-bench-kit = { path = "../../app/cce-bench-kit" }
tokio = { workspace = true, features = ["macros", "rt"] }

[[bench]]
name = "scan_hash"
harness = false

[[bench]]
name = "poll_rates"
harness = false

[[bench]]
name = "scan_parallel"
harness = false