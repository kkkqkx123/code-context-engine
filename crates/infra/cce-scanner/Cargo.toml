[package]
name = "cce-scanner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Project file scanning with manifest cache and encoding detection"
license.workspace = true
repository.workspace = true

[dependencies]
cce-types = { version = "0.1.0", path = "../../core/cce-types" }
cce-config = { version = "0.1.0", path = "../../core/cce-config" }
cce-utils = { version = "0.1.0", path = "../../core/cce-utils" }
encoding-guess = { path = "../../encoding-guess" }
cce-metrics = { version = "0.1.0", path = "../../core/cce-metrics" }
cce-plugin = { version = "0.1.0", path = "../../core/cce-plugin" }
cce-plugin-runtime = { version = "0.1.0", path = "../../app/cce-plugin-runtime" }

serde = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs"] }
rayon = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
criterion = { workspace = true }
rayon = { workspace = true }
num_cpus = { workspace = true }
cce-bench-kit = { version = "0.1.0", path = "../../app/cce-bench-kit" }
tokio = { workspace = true, features = ["macros", "rt"] }

[[bench]]
name = "scan_hash"
harness = false

[[bench]]
name = "poll_rates"
harness = false

[[bench]]
name = "scan_parallel"
harness = false