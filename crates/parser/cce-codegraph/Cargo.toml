[package]
name = "cce-codegraph"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Relation index, symbol tables, and call-chain queries"
license.workspace = true
repository.workspace = true

[dependencies]
# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
rkyv = { workspace = true, features = ["bytecheck", "alloc", "std"] }

# Error handling / logging
thiserror = { workspace = true }
tracing = { workspace = true }

# String optimization
compact_str = { workspace = true, features = ["serde"] }
smallvec = { workspace = true, features = ["serde"] }

# Text processing
regex = { workspace = true }
quick-xml = { workspace = true }
toml = { workspace = true }

# Tree-sitter (for helpers.rs import extraction)
tree-sitter = { workspace = true }

# Concurrency / data structures
dashmap = { workspace = true }
parking_lot = { workspace = true }
sha2 = { workspace = true }
rayon = { workspace = true }
lru = { workspace = true }

# Async
tokio = { workspace = true, features = ["sync", "rt", "rt-multi-thread", "fs"] }

# System paths (for external symbol discovery)
dirs = { workspace = true }

# Internal workspace crates
cce-types = { version = "0.1.0", path = "../../core/cce-types" }
cce-config = { version = "0.1.0", path = "../../core/cce-config" }
cce-utils = { version = "0.1.0", path = "../../core/cce-utils" }
cce-metrics = { version = "0.1.0", path = "../../core/cce-metrics" }
cce-plugin = { version = "0.1.0", path = "../../core/cce-plugin" }
cce-parser = { version = "0.1.0", path = "../cce-parser" }
cce-parser-core = { version = "0.1.0", path = "../cce-parser-core" }

[dev-dependencies]
tempfile = { workspace = true }
criterion = { workspace = true }
cce-parser = { version = "0.1.0", path = "../cce-parser" }
cce-parser-core = { version = "0.1.0", path = "../cce-parser-core" }
cce-plugin-runtime = { version = "0.1.0", path = "../../app/cce-plugin-runtime" }

[[bench]]
name = "relation_perf"
harness = false

[[bench]]
name = "final_replay"
harness = false

[[bench]]
name = "snapshot_cost"
harness = false

[[bench]]
name = "finalize_relation"
harness = false
