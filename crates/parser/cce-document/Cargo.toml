[package]
name = "cce-document"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Document processing pipeline for non-code files (markdown, json, toml, yaml, xml, plain text)"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
compact_str = { workspace = true, features = ["serde"] }
smallvec = { workspace = true, features = ["serde"] }
regex = { workspace = true }
once_cell = { workspace = true }
toml = { workspace = true }
yaml-rust2 = { workspace = true }
quick-xml = { workspace = true }

cce-types = { path = "../../core/cce-types" }
cce-config = { path = "../../core/cce-config" }
cce-utils = { path = "../../core/cce-utils" }
cce-text = { path = "../../core/cce-text" }
cce-plugin = { path = "../../core/cce-plugin" }

[dev-dependencies]
tempfile = { workspace = true }
