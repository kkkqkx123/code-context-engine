[package]
name = "cce-relation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Relation index, symbol tables, and call-chain queries"

[dependencies]
# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
rkyv = { workspace = true, features = ["bytecheck", "alloc", "std"] }

# Error handling / logging
thiserror = { workspace = true }
tracing = { workspace = true }

# String optimization
compact_str = { workspace = true, features = ["serde"] }
smallvec = { workspace = true, features = ["serde"] }

# Text processing
regex = { workspace = true }
quick-xml = { workspace = true }
toml = { workspace = true }

# Tree-sitter (for helpers.rs import extraction)
tree-sitter = { workspace = true }

# Concurrency / data structures
dashmap = { workspace = true }
parking_lot = { workspace = true }
sha2 = { workspace = true }
rayon = { workspace = true }
lru = { workspace = true }

# Async
tokio = { workspace = true, features = ["sync", "rt", "rt-multi-thread", "fs"] }

# System paths (for external symbol discovery)
dirs = { workspace = true }

# Internal workspace crates
cce-types = { path = "../../core/cce-types" }
cce-config = { path = "../../core/cce-config" }
cce-utils = { path = "../../core/cce-utils" }
cce-metrics = { path = "../../core/cce-metrics" }
cce-plugin = { path = "../../core/cce-plugin" }
cce-parser = { path = "../cce-parser" }
cce-parser-core = { path = "../cce-parser-core" }

[dev-dependencies]
tempfile = { workspace = true }
cce-parser = { path = "../cce-parser" }
cce-parser-core = { path = "../cce-parser-core" }
cce-plugin-runtime = { path = "../../app/cce-plugin-runtime" }
